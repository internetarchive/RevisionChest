[package]
name = "revisionchest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Extract and compress revision history from MediaWiki XML dumps into .mwrev.zst bundles, and keep them current from recent changes"
publish = false

[[bin]]
name = "RevisionChest"
path = "src/main.rs"

[features]
default = ["postgres"]
postgres = ["revisionchest-meta/postgres"]

[dependencies]
mwdump.workspace = true
mwrev.workspace = true
revisionchest-meta = { workspace = true, features = ["parquet"] }
clap.workspace = true
rayon.workspace = true
crossbeam-channel.workspace = true
chrono.workspace = true
dotenvy.workspace = true
reqwest.workspace = true
serde_json.workspace = true
moka.workspace = true

[dev-dependencies]
tempfile.workspace = true
