[package]
name = "revisionchest-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Where RevisionChest records what it wrote: page and revision metadata (bundle, offset, length) to Parquet, or to the Wikipedia Citations Database Postgres schema"
publish = false

[features]
default = ["parquet"]
parquet = ["dep:parquet", "dep:arrow"]
postgres = ["dep:postgres", "dep:r2d2", "dep:r2d2_postgres", "dep:md5", "dep:chrono"]

[dependencies]
thiserror.workspace = true
parquet = { workspace = true, optional = true }
arrow = { workspace = true, optional = true }
postgres = { workspace = true, optional = true }
r2d2 = { workspace = true, optional = true }
r2d2_postgres = { workspace = true, optional = true }
md5 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
