[package]
name = "mwdump"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Streaming reader and writer for MediaWiki XML dumps (pages-meta-history and friends): one event per page start, revision and page end, from .xml, .bz2, .gz or .7z, with hidden parts and content slots"
keywords = ["mediawiki", "wikipedia", "xml", "dump"]
categories = ["parser-implementations", "encoding"]

[dependencies]
quick-xml.workspace = true
bzip2.workspace = true
flate2.workspace = true
sevenz-rust2.workspace = true
sha1.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
